# API production v2 — r40_50cm BGO: the CRYSP ring, BGO_195K (dry-ice plateau, 14k ph/MeV, 1768 ns,
# 15% FWHM), r 40 cm (= CsI R35 + 5 cm cryostat), AFOV ~51 cm. BGO counterpart of the CsI
# crysp_r35_cm (the +5 cm is the cryostat penalty). Generation-2 (dev/generation2_plan.md):
# tumour-centred phantom; irradiation-end clock; fixed acquisition scenarios t_del in {120,180,300} s,
# t_ac = 300 s; isotope truth per LOR; Mizuno washout g_i stamped (NOT applied). Transport spans the
# union window [120,600] s; reco band-cuts each scenario into prod/<tag>/lors_det_del<NNN>.h5.
# Depth 2 X0 of BGO (2.236 cm). eres/sigma_xyz/timing from the BGO_195K entry in data/materials.json.

[source]
center_on     = "tumour"        # fixed anatomical reference: the SOBP dose-target centre (z≈−26 mm)
mode          = "api"
scenario_dir  = "../ptcrysp-scenarios/scenarios/uniform_headep_sobp_1e8"
budget        = "fast"          # N_j⁰ source (window-independent); NOT the acquisition window
dose_Gy       = 1.0
master_seed   = 1
realization   = 0
time_seed     = 1234
keep_escaped  = false

[geometry]
file = "geometry/geometry_r40_50cm_bgo_2x0.json"   # scanner crysp_r40_50cm_bgo_2x0 (r 40 cm, BGO 2X0)

[transport]
crystal_material = "BGO_195K"
seed             = 1234
nchunks          = 144

[timing]
tau_ns     = 5.0                       # 3σ of the raw t1−t2 for BGO (CTR study; σ_t-dominated)
t_ac_s     = 300.0                     # fixed acquisition length (5 min — realistic in-room PET)
t_del_list = [120.0, 180.0, 300.0]     # patient-arrival delays (irradiation-end clock)

[detector]
emin_keV      = 300.0                  # spectrum-study lower cut
reco_emin_keV = 413.0                  # photopeak cut: 511 − 3σ_E at 15% FWHM

[output]
format   = "hdf5"
prod_dir = "prod"
