# API production dd — ring1m BGO on the data-driven source: the reference BGO scanner
# (crysp_ring_1m_bgo_2x0, BGO_195K, AFOV ~102 cm) reading the uniform_headep_sobp_1e8_dd scenario,
# whose emitters are sampled from the nominal fitted cross sections (ptcryspg4
# workshop/xsections_phases.md phase 3d). Detector, timing, cuts and seeds are identical to
# uniform_headep_ring1m_bgo_v2, so sigma_R and fitted-edge differences from the native master
# measure the source alone. Generation-2 conventions: tumour-centred phantom; irradiation-end
# clock; fixed acquisition scenarios t_del in {120,180,300} s, t_ac = 300 s; transport spans the
# union window [120,600] s; reco band-cuts each scenario into prod/<tag>/lors_det_del<NNN>.h5.
# Depth 2 X0 of BGO (2.236 cm). eres, sigma_xyz, timing constants come from the BGO_195K entry in
# data/materials.json (no [detector] overrides beyond the reco cut).

[source]
center_on     = "tumour"        # fixed anatomical reference: the SOBP dose-target centre (z≈−26 mm)
mode          = "api"
scenario_dir  = "../ptcrysp-scenarios/scenarios/uniform_headep_sobp_1e8_dd"
budget        = "d120s300"      # N_j⁰ source (window-independent); NOT the acquisition window
dose_Gy       = 1.0
master_seed   = 1
realization   = 0
time_seed     = 1234
keep_escaped  = false

[geometry]
file = "geometry/geometry_ring1m_bgo_2x0.json"   # crysp_ring_1m_bgo_2x0 (r 43.7 cm = CsI + 5 cm cryostat, BGO 2X0)

[transport]
crystal_material = "BGO_195K"
seed             = 1234
nchunks          = 144

[timing]
tau_ns     = 5.0                       # 3σ of the raw t1−t2 for BGO (CTR study; σ_t-dominated)
t_ac_s     = 300.0                     # fixed acquisition length (5 min — realistic in-room PET)
t_del_list = [120.0, 180.0, 300.0]     # patient-arrival delays (irradiation-end clock)

[detector]
emin_keV      = 300.0                  # spectrum-study lower cut
reco_emin_keV = 413.0                  # photopeak cut: 511 − 3σ_E at 15% FWHM

[output]
format   = "hdf5"
prod_dir = "prod"
