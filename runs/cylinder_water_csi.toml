# Cylinder phantom (water) uniformly filled, CsI ring. Emin 300 keV (window off).

[geometry]
file = "geometry/geometry.json"
phantom_material = "Water"

[source]
kind = "phantom"
acol_fwhm_deg = 0.5
energy_keV = 511.0
nevents = 100000

[transport]
crystal_material = "CsI"
cutoff_keV = 10.0
seed = 1234

[detector]
sigma_xyz_mm = 1.7
eres = 0.05
emin_keV = 300.0
seed = 1234

[output]
dir = "output"
format = "csv"
singles = false
