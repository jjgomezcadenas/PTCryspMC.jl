# NEMA NU-2 Image-Quality phantom (Water body), BGO. CLINICAL, Option B (regions inline):
# water-body cavity (background) + six hot spheres (Ø 10/13/17/22/28/37 mm) on a 11.45 cm-dia ring,
# F-18, 4:1 hot:background. Water → real attenuation + Compton scatter (nscat1/nscat2 populated):
# the attenuating counterpart of nema_air_bgo.
#
# Realistic activity: background 5.3 kBq/mL → A0 ≈ 30.7 MBq; t1_s = 3.36 s lands N ≈ 1e8. HIGH-activity
# NEMA (randoms ∝ A²T large here — see nema_la_water_bgo for the ×0.1-activity / ×10-time low-randoms
# twin at the same N). tag = nema_water_bgo.
#
# Additive concentration: background fills the whole body; spheres carry the 3× increment (15.9
# kBq/mL) → effective 4:1.

[geometry]
file             = "geometry/geometry_nema.json"   # phantom = body cylinder R=10 cm, half-length 9 cm
phantom_material = "Water"

[source]
mode          = "clinic"
isotope       = "F18"            # T½ 109.8 min, β⁺ 0.9686
t0_s          = 0.0
t1_s          = 3.36             # → N ≈ 1.0e8 at A0 ≈ 30.7 MBq
acol_fwhm_deg = 0.5
energy_keV    = 511.0
time_seed     = 1234

region = [
  { shape = "cylinder", radius_cm = 10.0, half_length_cm = 9.0, position_cm = [ 0.00,  0.00, 0.0], conc_kBq_per_mL = 5.3  },  # background
  { shape = "sphere",   radius_cm = 1.85,                       position_cm = [ 5.72,  0.00, 0.0], conc_kBq_per_mL = 15.9 },  # 37 mm
  { shape = "sphere",   radius_cm = 1.40,                       position_cm = [ 2.86,  4.95, 0.0], conc_kBq_per_mL = 15.9 },  # 28 mm
  { shape = "sphere",   radius_cm = 1.10,                       position_cm = [-2.86,  4.95, 0.0], conc_kBq_per_mL = 15.9 },  # 22 mm
  { shape = "sphere",   radius_cm = 0.85,                       position_cm = [-5.72,  0.00, 0.0], conc_kBq_per_mL = 15.9 },  # 17 mm
  { shape = "sphere",   radius_cm = 0.65,                       position_cm = [-2.86, -4.95, 0.0], conc_kBq_per_mL = 15.9 },  # 13 mm
  { shape = "sphere",   radius_cm = 0.50,                       position_cm = [ 2.86, -4.95, 0.0], conc_kBq_per_mL = 15.9 },  # 10 mm
]

[transport]
crystal_material = "BGO_77K"
cutoff_keV       = 10.0
seed             = 1234
nchunks          = 144          # pinned → reproducible singles

[detector]
sigma_xyz_mm  = 1.7
eres          = 0.10            # 10% FWHM at 511 keV (cryogenic BGO)
emin_keV      = 300.0
reco_emin_keV = 450.0
seed          = 1234

[timing]
tau_ns = 3.0                    # coincidence window

[output]
dir    = "output"
format = "hdf5"
