# FROZEN REFERENCE — do not re-run. This config produced the crysp_ring_1m/bgo/fast_1Gy master
# (ten shards) with the historical hybrid "BGO" constants, since removed from data/materials.json
# (re-running errors on the material name — intentional). The current productions are the three
# crystal systems: uniform_headep_{bgo77k,bgo195k,csi}_api.toml (per-crystal 3 X0 depth, corrected
# scintillation constants, CTR-derived tau).
#
# API (Proton Activity) production: the positron activity a SOBP proton field leaves in a uniform
# brain head, imaged by the cryogenic-BGO CRYSP ring. Source = a frozen ptcryspg4 scenario
# (phantom + per-isotope emitter pools + decay budget); the phantom comes from the scenario's
# phantom_regions.csv, so [geometry].file supplies only the world + ring. The source is materialized
# (M_j ~ Poisson) seeded by (master_seed, realization), independent of [transport].seed — so every
# detector config at the same (master_seed, realization) sees the identical source.

[source]
mode          = "api"
scenario_dir  = "../ptcrysp-scenarios/scenarios/uniform_headep_sobp_1e8"   # relative to the repo root
budget        = "fast"        # acquisition timing: fast | inroom | offline
dose_Gy       = 1.0           # clinical dose (linear rescale of the per-isotope budget)
master_seed   = 1             # with realization, fixes the source draw (the identical-source contract)
realization   = 0             # realization index (bump for an independent σ_R realization)
time_seed     = 1234          # per-isotope decay-time seed (randoms timing)
keep_escaped  = false         # drop escaped positrons (outside the phantom) — the physical default

[geometry]
file = "geometry/geometry_head.json"

[transport]
crystal_material = "BGO"
seed             = 1234        # transport-chunk RNG (directions + interactions), separate from master_seed
nchunks          = 144         # pinned for reproducibility

[timing]
tau_ns = 3.0                   # coincidence window (crystal-independent; from the DT study)

[detector]
sigma_xyz_mm  = 1.7            # CRYSP position/DOI resolution (Gaussian σ per axis)
eres          = 0.10           # 10% FWHM @ 511 keV (cryogenic BGO)
emin_keV      = 300.0          # spectrum-study lower cut (Compton shoulder visible)
reco_emin_keV = 450.0          # photopeak lower cut for the detector LORs

[output]
format   = "hdf5"
prod_dir = "prod"
