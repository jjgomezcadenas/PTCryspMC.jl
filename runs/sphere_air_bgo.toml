# Sphere phantom, VACUUM (air ≈ no attenuation) — the non-attenuated reference. CLINICAL scenario:
# F-18 uniform fill at a TOTAL activity of 100 kHz over a 1000 s acquisition. N is derived:
# N = β⁺·(A₀/λ)(1−e^{−λT}) ≈ 0.9686 · 9.49×10⁷ ≈ 9.2×10⁷ (the F-18 decay shaves ~5% off the naive
# 10⁸, β⁺ another ~3%). BGO ring. No phantom scatter → an all-true, maximal-acceptance baseline.
# tag = sphere_air_bgo.

[geometry]
file             = "geometry/geometry_sphere.json"
phantom_material = "Vacuum"      # air ≈ vacuum: no attenuation / scatter (the reference)

[source]
mode          = "clinic"
isotope       = "F18"
t0_s          = 0.0
t1_s          = 1000.0           # ~16.7 min acquisition
acol_fwhm_deg = 0.5
energy_keV    = 511.0
time_seed     = 1234

[[source.region]]
volume       = "phantom"         # the whole sphere, uniform
activity_kBq = 100.0             # 100 kHz total over the sphere

[transport]
crystal_material = "BGO_77K"
cutoff_keV       = 10.0
seed             = 1234
nchunks          = 144           # pinned → reproducible singles

[detector]
sigma_xyz_mm  = 1.7
eres          = 0.10             # 10% FWHM at 511 keV (cryogenic BGO)
emin_keV      = 300.0
reco_emin_keV = 450.0
seed          = 1234

[timing]
tau_ns = 3.0                     # coincidence window

[output]
dir    = "output"
format = "hdf5"
