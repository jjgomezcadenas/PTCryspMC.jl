# Non-attenuated reference: sphere phantom filled with Vacuum (Σ=0, no scatter) so every
# coincidence is `true`. Same CsI ring + detector response as sphere_water_csi, so the two
# differ only in the phantom material — isolating the phantom-scatter contribution.

[geometry]
file = "geometry/geometry_sphere.json"
phantom_material = "Vacuum"     # non-attenuated reference

[source]
kind = "phantom"
acol_fwhm_deg = 0.5
energy_keV = 511.0
nevents = 50000

[transport]
crystal_material = "CsI"
cutoff_keV = 10.0
seed = 1234

[detector]
sigma_xyz_mm = 1.7
eres = 0.05
window_fwhm = 2.0

[output]
dir = "output"
format = "csv"
singles = false
