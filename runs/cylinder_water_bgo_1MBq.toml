# Cylinder phantom (Water), BGO ring. CLINICAL: F-18 uniform fill at a TOTAL activity of 1 MBq over a
# 100 s acquisition. N = β⁺·(A₀/λ)(1−e^{−λT}) ≈ 0.9686 · 9.95×10⁷ ≈ 9.6×10⁷ (set by the total
# activity, independent of phantom shape). Water → real attenuation + Compton scatter
# (nscat1/nscat2 populated): the attenuating counterpart of cylinder_air_bgo_1MBq and the cylinder
# counterpart of sphere_water_bgo_1MBq (same scanner + activity/time). tag = cylinder_water_bgo_1MBq.

[geometry]
file             = "geometry/geometry.json"   # cylinder phantom (R=8 cm, half-length 8 cm)
phantom_material = "Water"

[source]
mode          = "clinic"
isotope       = "F18"
t0_s          = 0.0
t1_s          = 100.0            # 100 s acquisition
acol_fwhm_deg = 0.5
energy_keV    = 511.0
time_seed     = 1234

[[source.region]]
volume       = "phantom"         # the whole cylinder, uniform
activity_kBq = 1000.0            # 1 MBq total

[transport]
crystal_material = "BGO_77K"
cutoff_keV       = 10.0
seed             = 1234
nchunks          = 144           # pinned → reproducible singles

[detector]
sigma_xyz_mm  = 1.7
eres          = 0.10             # 10% FWHM at 511 keV (cryogenic BGO)
emin_keV      = 300.0
reco_emin_keV = 450.0
seed          = 1234

[timing]
tau_ns = 3.0                     # coincidence window

[output]
dir    = "output"
format = "hdf5"
