# API production v2 — R35/35 CsI(Tl), POSITION MODEL 2 + 80% selection (position-resolution branch).
# Scanner crysp_r35_35cm_csi_2x0 (r 35 cm, AFOV ~36 cm), crystal CSI_TL (CsI(Tl): 50k ph/MeV,
# 680/3340 ns, 7% FWHM; same attenuation as CsI, σ_t kept at the CsI readout floor). Position
# smearing = model 2, the two-Gaussian core/tail mixture from data/pet_resolution_recipe.json
# (CryspLight CsI(Tl) fits averaged over x/y/z: σ1 1.152 / σ2 4.226 mm), at the 80% selection
# tier: per-gamma Bernoulli 0.8 (0.64 per LOR) with core fraction 0.789. Energy selection is the
# symmetric window 511 ± 2σ_E (window_fwhm = 2/2.3548; ±30.4 keV at 7%) — no separate lower cut.
# Generation-2 timing convention unchanged (tumour-centred; t_del in {120,180,300} s, t_ac 300 s).
# Products: <scenario>/crysp_r35_35cm_csi_2x0/csi_tl/del<..>s_ac300s_1Gy/.

[source]
center_on     = "tumour"        # fixed anatomical reference: the SOBP dose-target centre (z≈−26 mm)
mode          = "api"
scenario_dir  = "../ptcrysp-scenarios/scenarios/uniform_headep_sobp_1e8"
budget        = "fast"          # N_j⁰ source (window-independent); NOT the acquisition window
dose_Gy       = 1.0
master_seed   = 1
realization   = 0
time_seed     = 1234
keep_escaped  = false

[geometry]
file = "geometry/geometry_r35_35cm_csi_2x0.json"   # scanner crysp_r35_35cm_csi_2x0 (r 35 cm, AFOV ~36 cm)

[transport]
crystal_material = "CSI_TL"
seed             = 1234
nchunks          = 144

[timing]
tau_ns     = 1.5                       # kept from the CsI CTR study (σ_t 0.35 ns dominates; JJ: tau is fine)
t_ac_s     = 300.0                     # fixed acquisition length (5 min — realistic in-room PET)
t_del_list = [120.0, 180.0, 300.0]     # patient-arrival delays (irradiation-end clock)

[detector]
emin_keV      = 300.0                  # spectrum-study lower cut (dev chain only)
reco_emin_keV = 0.0                    # reco selection is the symmetric window alone
window_fwhm   = 0.84933                # ±2σ_E about 511 keV (= 2/2.3548 in FWHM units → ±30.4 keV at 7%)
pos_model     = 2                      # two-Gaussian core/tail mixture (pos2 constants on CSI_TL)
selection     = "80"                   # 80% tier: per-gamma eff 0.8, core fraction 0.789

[output]
format   = "hdf5"
prod_dir = "prod"
