# Sphere phantom (water) uniformly filled, CsI ring. Realistic detector response with a
# 300 keV minimum-energy cut (window off) so the Compton shoulder/edge shows in the spectrum.
# tag = config filename = sphere_water_csi -> output/sphere_water_csi/

[geometry]
file = "geometry/geometry_sphere.json"
phantom_material = "Water"

[source]
kind = "phantom"
acol_fwhm_deg = 0.5
energy_keV = 511.0
nevents = 100000

[transport]
crystal_material = "CsI"
cutoff_keV = 10.0
seed = 1234

[detector]
sigma_xyz_mm = 1.7
eres = 0.05                     # 5% FWHM at 511 keV (pure CsI)
emin_keV = 300.0               # spectrum studies: low cut, keeps the Compton shoulder (window off)
reco_emin_keV = 450.0          # reconstructed LORs: photopeak-region lower cut (~3σ@10%), saves disk
seed = 1234

[timing]
tau_ns = 3.0                   # coincidence window (DT study: keeps ~99% of trues; CsI & BGO)
# activity defaults if omitted: ¹⁵O, t0_s=0, t1_s=600, half_life_s=122.2, time_seed=1234

[output]
dir = "output"
format = "csv"
singles = false
