# NEMA NU-2 Image-Quality phantom, LOW ACTIVITY (LA), Water body — BGO.
# CLINICAL, Option B (regions inline): water-body background + six hot spheres, F-18, 4:1.
# Water → real attenuation + Compton scatter (nscat1/nscat2 populated).
#
# LOW-ACTIVITY twin of nema_water_bgo: activity ×0.1 (background 0.53 kBq/mL → A0 ≈ 3.07 MBq) and the
# acquisition ×10 (t1_s = 33.6 s), so N is UNCHANGED (≈ 1e8) but randoms (∝ A²·T) drop by 10×. The
# realistic-randoms, with-attenuation NEMA point. tag = nema_la_water_bgo.
#
# Additive concentration: spheres carry the 3× increment (1.59 kBq/mL) over background → effective 4:1.

[geometry]
file             = "geometry/geometry_nema.json"   # phantom = body cylinder R=10 cm, half-length 9 cm
phantom_material = "Water"

[source]
mode          = "clinic"
isotope       = "F18"            # T½ 109.8 min, β⁺ 0.9686
t0_s          = 0.0
t1_s          = 33.6             # ×10 the high-activity frame → N ≈ 1.0e8 at A0 ≈ 3.07 MBq
acol_fwhm_deg = 0.5
energy_keV    = 511.0
time_seed     = 1234

region = [
  { shape = "cylinder", radius_cm = 10.0, half_length_cm = 9.0, position_cm = [ 0.00,  0.00, 0.0], conc_kBq_per_mL = 0.53 },  # background
  { shape = "sphere",   radius_cm = 1.85,                       position_cm = [ 5.72,  0.00, 0.0], conc_kBq_per_mL = 1.59 },  # 37 mm
  { shape = "sphere",   radius_cm = 1.40,                       position_cm = [ 2.86,  4.95, 0.0], conc_kBq_per_mL = 1.59 },  # 28 mm
  { shape = "sphere",   radius_cm = 1.10,                       position_cm = [-2.86,  4.95, 0.0], conc_kBq_per_mL = 1.59 },  # 22 mm
  { shape = "sphere",   radius_cm = 0.85,                       position_cm = [-5.72,  0.00, 0.0], conc_kBq_per_mL = 1.59 },  # 17 mm
  { shape = "sphere",   radius_cm = 0.65,                       position_cm = [-2.86, -4.95, 0.0], conc_kBq_per_mL = 1.59 },  # 13 mm
  { shape = "sphere",   radius_cm = 0.50,                       position_cm = [ 2.86, -4.95, 0.0], conc_kBq_per_mL = 1.59 },  # 10 mm
]

[transport]
crystal_material = "BGO"
cutoff_keV       = 10.0
seed             = 1234
nchunks          = 144          # pinned → reproducible singles

[detector]
sigma_xyz_mm  = 1.7
eres          = 0.10            # 10% FWHM at 511 keV (cryogenic BGO)
emin_keV      = 300.0
reco_emin_keV = 450.0
seed          = 1234

[timing]
tau_ns = 3.0                    # coincidence window

[output]
dir    = "output"
format = "hdf5"
